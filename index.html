<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Blip — iOS</title>
<script src="/config.js"></script>
<script src="/lib/peerjs.min.js"></script>
<script src="/lib/qrcode.min.js"></script>
<style>
  :root { --bg:#131317; --mica:rgba(28,28,30,0.72); --card:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.08); --accent:#60a5fa; --text:#e7e7ea; --muted:#9aa0a6; --success:#22c55e; }
  *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial;overflow:hidden}
  .app{display:flex;height:100%}
  .sidebar{width:280px;position:fixed;left:0;top:0;bottom:0;background:var(--mica);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:18px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
  .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#3b82f6);display:grid;place-items:center;font-weight:700}
  .brand h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.3px}
  .device-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
  .device-header{display:flex;align-items:center;gap:10px}
  .avatar{width:40px;height:40px;border-radius:50%;background:#2a2a2e;display:grid;place-items:center;font-weight:600}
  .meta{flex:1;min-width:0}
  .meta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#6b7280}
  .status-dot.ready{background:var(--success);box-shadow:0 0 8px rgba(34,197,94,.6)}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(96,165,250,.18);color:#a5c9ff;border:1px solid rgba(96,165,250,.3)}
  .qr{margin-top:12px;background:#0b0b0c;border:1px solid var(--border);border-radius:10px;padding:10px;display:grid;place-items:center}
  .qr canvas{width:132px!important;height:132px!important}
  .hint{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
  .history{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
  .history h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 8px}
  .hist-item{padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center;font-size:13px}
  .hist-item:hover{background:rgba(255,255,255,.04)}
  .content{margin-left:280px;width:calc(100% - 280px);height:100vh;overflow-y:auto;background:radial-gradient(900px 400px at 80% -10%, rgba(124,58,237,.15), transparent),radial-gradient(700px 300px at 20% 110%, rgba(59,130,246,.12), transparent),#131317;padding:28px 32px}
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}
  .input{height:38px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:0 12px;color:var(--text);outline:none;width:180px}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-weight:500}
  .btn.primary{background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:#1d4ed8}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px;backdrop-filter:blur(16px)}
  .drop{border:1.5px dashed rgba(255,255,255,.18);border-radius:14px;padding:36px;text-align:center;transition:.2s;background:rgba(255,255,255,.02)}
  .drop.drag{border-color:var(--accent);background:rgba(96,165,250,.08)}
  .drop h3{margin:8px 0 4px} .drop p{margin:0;color:var(--muted);font-size:13px}
  .progress{height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:10px}
  .bar{height:100%;width:0%;background:linear-gradient(90deg,#60a5fa,#22d3ee);transition:width .15s}
  .transfers{display:grid;gap:10px}
  .tx{padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--border);display:grid;gap:8px}
  .tx-head{display:flex;justify-content:space-between;align-items:center;font-size:14px}
  .tx-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
  .tx-meta{font-size:12px;color:var(--muted)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50}
  .modal.hidden{display:none}
  .modal-card{width:380px;background:#1c1e22;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-card h3{margin:0 0 6px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  @media(max-width:960px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.content{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">B</div><h1>Blip</h1></div>
    <div class="device-card">
      <div class="device-header">
        <div class="avatar" id="avatar">B</div>
        <div class="meta">
          <div class="name" id="devName">Blip Device</div>
          <div class="sub"><span class="status-dot" id="statusDot"></span><span id="statusText">Starting…</span> <span class="badge">Local</span></div>
        </div>
      </div>
      <div class="qr"><canvas id="qr"></canvas><div class="hint" id="qrHint">Scan to open on phone</div></div>
      <div style="margin-top:10px;font-size:12px;color:var(--muted)">Your ID: <b id="myId">------</b></div>
    </div>
    <div class="history"><h3>Recent</h3><div id="historyList"></div></div>
  </aside>
  <main class="content">
    <div class="toolbar">
      <input id="remoteId" class="input" placeholder="Enter peer code" maxlength="6">
      <button id="connectBtn" class="btn primary">Connect</button>
      <span id="connState" style="color:var(--muted);font-size:13px">Not connected</span>
      <div style="flex:1"></div>
      <input type="file" id="fileInput" multiple hidden>
      <button id="pickBtn" class="btn" disabled>Choose files</button>
    </div>
    <div class="panel">
      <div id="drop" class="drop">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/></svg>
        <h3>Drop files to send</h3>
        <p>64 KB chunked • end-to-end encrypted • stays on LAN</p>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin:0 0 10px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Transfers</h3>
      <div id="transfers" class="transfers"></div>
    </div>
  </main>
</div>
<div id="receiveModal" class="modal hidden">
  <div class="modal-card">
    <h3>Incoming file</h3>
    <div id="recvInfo" style="font-size:14px;color:var(--muted)"></div>
    <div class="progress"><div id="recvBar" class="bar"></div></div>
    <div class="modal-actions">
      <button id="declineBtn" class="btn">Decline</button>
      <button id="acceptBtn" class="btn primary">Accept</button>
    </div>
  </div>
</div>
<script>
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const CHUNK=64*1024; const $=id=>document.getElementById(id);
function genId(){const c='abcdefghijklmnopqrstuvwxyz0123456789';let o='';for(let i=0;i<6;i++)o+=c[Math.floor(Math.random()*c.length)];return o}
const myId=localStorage.getItem('blip-id')||genId(); localStorage.setItem('blip-id',myId);
$('myId').textContent=myId.toUpperCase(); $('devName').textContent='Blip-'+myId.toUpperCase(); $('avatar').textContent=myId.slice(0,1).toUpperCase();
const shareURL=`http://${(window.LOCAL_IP||location.hostname)}:${window.LOCAL_PORT||3000}`;
QRCode.toCanvas($('qr'), shareURL, {width:132, margin:1, color:{dark:'#ffffff', light:'#00000000'}}); $('qrHint').textContent=shareURL;
let peer, conn=null; function setStatus(t,ready=false){$('statusText').textContent=t; $('statusDot').className='status-dot'+(ready?' ready':'');}
setStatus('Connecting…');
peer=new Peer(myId,{host:location.hostname,port:9000,path:'/',secure:false,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
peer.on('open',()=>{setStatus('Ready',true);$('connState').textContent='Ready'}); peer.on('error',e=>{setStatus('Error');console.error(e)}); peer.on('connection',c=>setupConnection(c,true));
$('connectBtn').onclick=()=>{const rid=$('remoteId').value.trim().toLowerCase(); if(!rid)return; if(conn)conn.close(); const c=peer.connect(rid,{reliable:true}); setupConnection(c,false);};
function setupConnection(c,inbound){conn=c; $('connState').textContent=inbound?`Incoming: ${c.peer}`:'Connecting…'; $('pickBtn').disabled=true; c.on('open',()=>{$('connState').textContent='Connected to '+c.peer.toUpperCase();$('pickBtn').disabled=false;addSystemTx('Connected')}); c.on('data',handleData); c.on('close',()=>{$('connState').textContent='Disconnected';$('pickBtn').disabled=true;addSystemTx('Disconnected')});}
$('pickBtn').onclick=()=>$('fileInput').click(); $('fileInput').onchange=e=>{[...e.target.files].forEach(f=>queueSend(f))};
const drop=$('drop'); ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')})); ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')})); drop.addEventListener('drop',e=>{[...e.dataTransfer.files].forEach(f=>queueSend(f))});
let sendQueue=[]; function queueSend(file){if(!conn||!conn.open){alert('Connect first');return} sendQueue.push(file); processQueue();}
async function processQueue(){if(processQueue.busy)return;processQueue.busy=true;while(sendQueue.length){await sendFile(sendQueue.shift())}processQueue.busy=false;}
function sendFile(file){return new Promise(resolve=>{const tx=addTx('send',file.name,file.size); const meta={type:'meta',name:file.name,size:file.size,mime:file.type||'application/octet-stream'}; conn.send(meta); let accepted=false; const onCtrl=d=>{if(d&&d.type==='accept'&&d.name===file.name){accepted=true;conn.off('data',onCtrl);start()} if(d&&d.type==='decline'&&d.name===file.name){conn.off('data',onCtrl);tx.status('Declined');resolve()}}; conn.on('data',onCtrl); function start(){let offset=0; const reader=new FileReader(); function pump(){if(offset>=file.size){conn.send({type:'end',name:file.name});tx.status('Sent');addHistory({dir:'send',name:file.name,size:file.size,peer:conn.peer});resolve();return} const slice=file.slice(offset,offset+CHUNK); reader.onload=e=>{conn.send({type:'chunk',data:e.target.result,name:file.name}); offset+=e.target.result.byteLength; tx.progress(offset/file.size); setTimeout(pump,0)}; reader.readAsArrayBuffer(slice)} pump()} setTimeout(()=>{if(!accepted){conn.off('data',onCtrl);tx.status('No response');resolve()}},30000)})}
let incoming=null; const modal=$('receiveModal'),recvInfo=$('recvInfo'),recvBar=$('recvBar'); $('acceptBtn').onclick=()=>{if(incoming){conn.send({type:'accept',name:incoming.meta.name});beginReceive()}}; $('declineBtn').onclick=()=>{if(incoming){conn.send({type:'decline',name:incoming.meta.name});closeModal()}};
function handleData(d){if(!d||!d.type)return; if(d.type==='meta'){incoming={meta:d,buffers:[],received:0}; recvInfo.innerHTML=`<b>${escapeHTML(d.name)}</b><br>${(d.size/1024/1024).toFixed(2)} MB from ${conn.peer.toUpperCase()}`; recvBar.style.width='0%'; modal.classList.remove('hidden')} else if(d.type==='chunk'&&incoming&&d.name===incoming.meta.name){incoming.buffers.push(d.data); incoming.received+=d.data.byteLength; recvBar.style.width=Math.floor(incoming.received/incoming.meta.size*100)+'%'} else if(d.type==='end'&&incoming&&d.name===incoming.meta.name){finishReceive()}}
function beginReceive(){$('acceptBtn').disabled=true;$('declineBtn').disabled=true}
function finishReceive(){const{meta,buffers}=incoming; const blob=new Blob(buffers,{type:meta.mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a');a.href=url;a.download=meta.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);addTx('recv',meta.name,meta.size,true);addHistory({dir:'recv',name:meta.name,size:meta.size,peer:conn.peer});closeModal()}
function closeModal(){modal.classList.add('hidden');$('acceptBtn').disabled=false;$('declineBtn').disabled=false;incoming=null}
function addTx(dir,name,size,done=false){const el=document.createElement('div');el.className='tx';el.innerHTML=`<div class="tx-head"><div class="tx-name">${dir==='send'?'↑':'↓'} ${escapeHTML(name)}</div><div class="tx-meta">${(size/1024/1024).toFixed(2)} MB</div></div><div class="progress"><div class="bar"></div></div><div class="tx-meta status">${done?'Completed':'Waiting…'}</div>`;$('transfers').prepend(el);const bar=el.querySelector('.bar'),st=el.querySelector('.status');return{progress:p=>bar.style.width=(p*100).toFixed(1)+'%',status:t=>st.textContent=t}}
function addSystemTx(msg){addTx('sys',msg,0,true).status(msg)}
function addHistory(e){const h=JSON.parse(localStorage.getItem('blip-history')||'[]');h.unshift({...e,t:Date.now()});localStorage.setItem('blip-history',JSON.stringify(h.slice(0,50)));renderHistory()}
function renderHistory(){const h=JSON.parse(localStorage.getItem('blip-history')||'[]');$('historyList').innerHTML=h.map(i=>`<div class="hist-item">${i.dir==='send'?'↑':'↓'} <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(i.name)}</span></div>`).join('')||'<div style="color:var(--muted);padding:8px">No transfers yet</div>'}
renderHistory();
</script>
</body>
</html>
